description: >-
  Density and load economics for context: the two loads, the load tiers
  (always, by location, on demand, never) with their tests and ctxmod
  mechanisms, the in-document ladder, budgets by category, the
  pointer principle, pruning, and long-horizon context (compaction,
  notes, memory, sub-agent summaries); with the uncondensed source
  doctrine (agent-facing writing, context efficiency with context rot,
  just-in-time retrieval, cache-stable prefixes and tool-result economy,
  density by frequency, reference over duplication).
binds_to_depth: main...
